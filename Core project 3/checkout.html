```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>UrbanCart | Checkout</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            UrbanCart
        </a>

    </div>

</nav>


<main class="container py-5">

    <div class="row">

        <!-- Customer Details -->
        <div class="col-md-7">

            <h2 class="mb-4">
                Checkout
            </h2>

            <form id="checkoutForm">

                <h4>
                    Delivery Information
                </h4>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            First Name
                        </label>

                        <input
                            type="text"
                            name="firstName"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Last Name
                        </label>

                        <input
                            type="text"
                            name="lastName"
                            class="form-control"
                            required
                        >

                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Delivery Address
                    </label>

                    <textarea
                        name="address"
                        class="form-control"
                        rows="3"
                        required
                    ></textarea>

                </div>


                <h4 class="mt-4">
                    Payment
                </h4>


                <div class="mb-3">

                    <label class="form-label">
                        Payment Method
                    </label>

                    <select
                        name="paymentMethod"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select payment method
                        </option>

                        <option value="card">
                            Credit/Debit Card
                        </option>

                        <option value="eft">
                            EFT
                        </option>

                        <option value="simulated">
                            Simulated Payment
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Card Number
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        placeholder="0000 0000 0000 0000"
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-dark btn-lg"
                >
                    Place Order
                </button>

            </form>

        </div>


        <!-- Order Summary -->
        <div class="col-md-5">

            <div class="card">

                <div class="card-body">

                    <h4>
                        Order Summary
                    </h4>

                    <hr>

                    <div id="checkoutItems">
                        <!-- Items inserted dynamically -->
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between">

                        <strong>
                            Total
                        </strong>

                        <strong id="checkoutTotal">
                            R0.00
                        </strong>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

</body>
</html>
```
