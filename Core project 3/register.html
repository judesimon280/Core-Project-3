```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>UrbanCart | Register</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            UrbanCart
        </a>

    </div>

</nav>


<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Create an Account
                    </h2>


                    <form id="registerForm">

                        <div class="mb-3">

                            <label for="firstName" class="form-label">
                                First Name
                            </label>

                            <input
                                type="text"
                                id="firstName"
                                name="firstName"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label for="lastName" class="form-label">
                                Last Name
                            </label>

                            <input
                                type="text"
                                id="lastName"
                                name="lastName"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label for="email" class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                minlength="8"
                                required
                            >

                            <small class="text-muted">
                                Password must contain at least 8 characters.
                            </small>

                        </div>


                        <div class="mb-3">

                            <label for="confirmPassword" class="form-label">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Create Account
                        </button>

                    </form>


                    <p class="text-center mt-3">

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</main>

</body>
</html>
```
