```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>UrbanCart | Cart</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            UrbanCart
        </a>

        <a href="products.html" class="btn btn-light">
            Continue Shopping
        </a>

    </div>

</nav>


<main class="container py-5">

    <h1 class="mb-4">
        Shopping Cart
    </h1>


    <div class="table-responsive">

        <table class="table table-bordered">

            <thead class="table-dark">

                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="cartItems">

                <!-- Cart items loaded by JavaScript -->

            </tbody>

        </table>

    </div>


    <div class="text-end">

        <h3>
            Total:
            <span id="cartTotal">R0.00</span>
        </h3>

        <a
            href="checkout.html"
            class="btn btn-dark"
        >
            Proceed to Checkout
        </a>

    </div>

</main>

</body>
</html>
```
